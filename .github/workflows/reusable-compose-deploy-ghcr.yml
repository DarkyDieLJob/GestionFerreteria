name: Reusable Compose Deploy (GHCR)

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      runner_labels_json:
        required: true
        type: string
      image_registry:
        required: false
        type: string
        default: ghcr.io
      image_repo:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      profiles:
        required: false
        type: string
        default: db,broker,web
      fake_migrations:
        required: false
        type: string
        default: ''
      smoke_url:
        required: false
        type: string
        default: http://127.0.0.1:8001/
      smoke_timeout_seconds:
        required: false
        type: number
        default: 120

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy (${{ inputs.environment_name }})
    environment:
      name: ${{ inputs.environment_name }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker availability
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo "docker not found on runner (PATH). Install Docker and ensure runner user can execute it."; exit 1; }
          docker --version
          docker compose version || true

      - name: Docker login to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | docker login ${{ inputs.image_registry }} -u ${{ github.actor }} --password-stdin

      - name: Set image environment
        run: |
          echo "IMAGE_REGISTRY=${{ inputs.image_registry }}" >> $GITHUB_ENV
          echo "IMAGE_REPO=${{ inputs.image_repo }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_ENV

      - name: Disk space diagnostics and Docker cleanup (if low)
        shell: bash
        run: |
          set -euo pipefail
          echo "== Disk usage (df -h) =="
          df -h || true
          echo
          echo "== Disk usage (/var) =="
          df -hT /var || true
          echo
          echo "== Docker usage (docker system df) =="
          docker system df || true

          # containerd/docker write mostly under /var on this runner.
          # If /var has less than ~1200MB available, attempt aggressive cleanup.
          avail_mb=$(df -Pm /var | awk 'NR==2{print $4}')
          echo "/var available: ${avail_mb}MB"
          if [ -n "${avail_mb}" ] && [ "${avail_mb}" -lt 1200 ]; then
            echo "Low disk space detected on /var (<1200MB available). Running Docker cleanup..." >&2
            docker compose down -v --remove-orphans || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            docker volume prune -f || true
            echo "== After cleanup (df -h) =="
            df -h || true
            echo "== After cleanup (df -hT /var) =="
            df -hT /var || true
            echo "== After cleanup (docker system df) =="
            docker system df || true
          else
            echo "Disk space OK; skipping cleanup."
          fi

      - name: Pull images (with profiles)
        env:
          COMPOSE_PROFILES: ${{ inputs.profiles }}
        run: docker compose pull

      - name: Compose diagnostics (before up)
        env:
          COMPOSE_PROFILES: ${{ inputs.profiles }}
        shell: bash
        run: |
          pwd
          ls -la
          ls -la docker-compose.yml docker-compose.yaml compose.yml compose.yaml || true
          echo "COMPOSE_PROFILES=$COMPOSE_PROFILES"
          env | sort | grep -E 'COMPOSE|IMAGE_|POSTGRES|DJANGO|ENV' || true
          docker compose version || true
          docker compose config --services || true
          docker compose config --profiles || true

      - name: Compose up deps (db + broker)
        env:
          COMPOSE_PROFILES: ${{ inputs.profiles }}
        run: docker compose --profile db --profile broker up -d db redis

      - name: Wait for DB health (diagnostics)
        env:
          COMPOSE_PROFILES: ${{ inputs.profiles }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' gestionferreteria-db 2>/dev/null || echo 'missing')
            echo "db health/status: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "missing" ]; then
              echo "DB is not healthy ($status). Showing db logs..." >&2
              docker compose logs --no-color db || true
              docker inspect gestionferreteria-db || true
              exit 1
            fi
            sleep 2
          done
          echo "DB did not become healthy in time. Showing db logs..." >&2
          docker compose logs --no-color db || true
          docker inspect gestionferreteria-db || true
          exit 1

      - name: Fake migrations (optional)
        if: inputs.fake_migrations != ''
        env:
          COMPOSE_PROFILES: ${{ inputs.profiles }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ITEMS <<< "${{ inputs.fake_migrations }}"
          for item in "${ITEMS[@]}"; do
            item_trimmed=$(echo "$item" | xargs)
            app=${item_trimmed%%:*}
            mig=${item_trimmed##*:}
            if [ -z "$app" ] || [ -z "$mig" ] || [ "$app" = "$mig" ]; then
              echo "Invalid fake migration entry: '$item_trimmed' (expected app:migration)" >&2
              exit 1
            fi
            echo "Faking migration: $app $mig"
            docker compose run --rm -e ENABLE_MIGRATE=false -e ENABLE_MAKEMIGRATIONS=false app python src/manage.py migrate "$app" "$mig" --fake
          done

      - name: Run migrations (in-situ)
        env:
          COMPOSE_PROFILES: ${{ inputs.profiles }}
        shell: bash
        run: |
          set -euo pipefail
          migrate_cmd=(docker compose run --rm -e ENABLE_MIGRATE=false -e ENABLE_MAKEMIGRATIONS=false app python src/manage.py migrate --fake-initial --run-syncdb --noinput)
          set +e
          out=$("${migrate_cmd[@]}" 2>&1)
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            exit 0
          fi
          echo "$out" >&2
          if ! echo "$out" | grep -Eqi 'already exists|DuplicateTable'; then
            exit $code
          fi
          mig=$(echo "$out" | sed -nE 's/^\s*Applying\s+([a-zA-Z0-9_]+)\.([0-9]{4}[^[:space:]]*).*/\1 \2/p' | tail -n 1)
          if [ -n "$mig" ]; then
            app=$(echo "$mig" | awk '{print $1}')
            name_raw=$(echo "$mig" | awk '{print $2}')
            # Django sometimes prints: "Applying app.0002_name...Traceback" on a single line.
            # Strip everything after the first "..." and validate token shape.
            name=$(echo "$name_raw" | sed -E 's/\.\.\..*$//' | sed -E 's/[^a-zA-Z0-9_].*$//')
            if echo "$name" | grep -Eq '^[0-9]{4}_[a-zA-Z0-9_]+$'; then
              echo "Migration failed due to DuplicateTable. Faking migration: $app $name and retrying..." >&2
              docker compose run --rm -e ENABLE_MIGRATE=false -e ENABLE_MAKEMIGRATIONS=false app python src/manage.py migrate "$app" "$name" --fake
              "${migrate_cmd[@]}"
              exit $?
            fi
          fi

          # Fallback for known production issue: existing core_auth_coreauthprofile table with desynced migration history.
          if echo "$out" | grep -Eqi 'core_auth_coreauthprofile'; then
            echo "DuplicateTable for core_auth_coreauthprofile detected. Faking core_auth 0002_coreauthprofile_passwordresetrequest and retrying..." >&2
            docker compose run --rm -e ENABLE_MIGRATE=false -e ENABLE_MAKEMIGRATIONS=false app python src/manage.py migrate core_auth 0002_coreauthprofile_passwordresetrequest --fake
            "${migrate_cmd[@]}"
            exit $?
          fi

          echo "DuplicateTable detected but could not parse failing migration reliably. Aborting." >&2
          exit $code

      - name: Compose up (with profiles)
        env:
          COMPOSE_PROFILES: ${{ inputs.profiles }}
        run: docker compose --profile db --profile broker --profile web up -d --remove-orphans

      - name: Smoke check
        env:
          SMOKE_URL: ${{ inputs.smoke_url }}
          SMOKE_TIMEOUT: ${{ inputs.smoke_timeout_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          end=$((SECONDS+SMOKE_TIMEOUT))
          until curl -fsS "$SMOKE_URL" >/dev/null; do
            [ $SECONDS -ge $end ] && { echo "Smoke failed"; docker compose logs --no-color app || true; exit 1; }
            sleep 3
          done
