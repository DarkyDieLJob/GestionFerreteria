name: Release (build + deploy prod)

on:
  push:
    tags:
      - 'v*'
      - 'test-pipeline-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag de imagen (vX.Y.Z o test-pipeline-YYYYMMDD-N). Si se deja vacío, se usa github.ref_name (solo válido si el workflow corre sobre un tag).'
        required: false
        type: string
      fake_migrations:
        description: 'Opcional. Lista separada por comas de migraciones a marcar como aplicadas (FAKE) antes de migrar. Formato: app_label:migration (ej: core_auth:0002).'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build-push.yml
    secrets: inherit
    with:
      image_repo: darkydieljob/gestionferreteria
      tags: ${{ format('ghcr.io/darkydieljob/gestionferreteria:{0}', inputs.version != '' && inputs.version || github.ref_name) }}
      platforms: linux/amd64,linux/arm64
      context: .
      dockerfile: Dockerfile

  deploy_staging:
    name: Deploy (staging)
    needs: [build]
    uses: ./.github/workflows/reusable-compose-deploy-ghcr.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      environment_name: staging
      runner_labels_json: '["self-hosted","stage","docker"]'
      image_registry: ghcr.io
      image_repo: darkydieljob/gestionferreteria
      image_tag: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      profiles: db,broker,web
      fake_migrations: ${{ inputs.fake_migrations }}
      smoke_url: http://127.0.0.1:8001/
      smoke_timeout_seconds: 120

  backmerge_release_to_develop:
    name: Back-merge release -> develop
    needs: [deploy_staging]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin +refs/heads/*:refs/remotes/origin/* --prune

      - name: Merge release into develop
        shell: bash
        run: |
          set -euxo pipefail
          git checkout develop
          git reset --hard origin/develop
          git merge --no-ff origin/release -m "chore: back-merge release into develop after ${{ github.ref_name }}"
          if git diff --quiet origin/develop...HEAD; then
            echo "No changes to push"
          else
            git push origin HEAD:develop
          fi

  deploy_prod:
    name: Deploy (production)
    needs: [backmerge_release_to_develop]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    uses: ./.github/workflows/reusable-compose-deploy-ghcr.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
    with:
      environment_name: production
      runner_labels_json: '["self-hosted","prod","docker"]'
      image_registry: ghcr.io
      image_repo: darkydieljob/gestionferreteria
      image_tag: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      profiles: db,broker,web
      fake_migrations: ${{ inputs.fake_migrations }}
      smoke_url: http://127.0.0.1:8001/
      smoke_timeout_seconds: 120
