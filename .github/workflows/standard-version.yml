name: Standard Version (tag + changelog)

on:
  push:
    branches:
      - release

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  standard_version:
    name: standard-version
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run standard-version (no tag)
        run: npx standard-version --skip.tag

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push release commit
        run: git push origin HEAD:release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (vX.Y.Z)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ format('ghcr.io/darkydieljob/gestionferreteria:{0}', steps.version.outputs.tag) }}

      - name: Create and push git tag (after build)
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          git tag -a "$TAG" -m "chore(release): $VERSION"
          git push origin "$TAG"

      - name: Dispatch deploy workflow (release-cicd)
        uses: actions/github-script@v7
        with:
          script: |
            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-cicd.yml',
              ref: 'release',
              inputs: {
                version: '${{ steps.version.outputs.tag }}'
              }
            }

            const maxAttempts = 5
            let lastErr
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                await github.rest.actions.createWorkflowDispatch(payload)
                core.info(`Workflow dispatch succeeded on attempt ${attempt}/${maxAttempts}`)
                return
              } catch (err) {
                lastErr = err
                const status = err?.status || err?.response?.status
                const msg = err?.message || String(err)
                core.warning(`Workflow dispatch failed (attempt ${attempt}/${maxAttempts}) status=${status}: ${msg}`)

                // Retry only for transient errors (5xx / 429)
                if (attempt === maxAttempts || !(status === 429 || (status >= 500 && status < 600))) {
                  throw err
                }

                const delayMs = Math.min(30000, 1000 * Math.pow(2, attempt - 1))
                core.info(`Retrying in ${delayMs}ms...`)
                await new Promise(r => setTimeout(r, delayMs))
              }
            }

            throw lastErr
