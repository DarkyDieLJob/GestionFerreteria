name: Reusable Build & Push (GHCR)

on:
  workflow_call:
    inputs:
      image_repo:
        required: true
        type: string
      tags:
        required: true
        type: string
      platforms:
        required: false
        type: string
        default: linux/amd64
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      target:
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build_push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.tags }}
          target: ${{ inputs.target }}
